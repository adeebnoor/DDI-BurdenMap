<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">DDI burden concentration across three networks</title>
<desc id="desc">Top ten percent of drugs account for 42.3 percent of candidate endpoints, 45.1 percent of construction-reference endpoints, and 31.6 percent of DDInter endpoints.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2d"/><stop offset="1" stop-color="#103a52"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".18"/></filter>
</defs>
<rect width="1100" height="430" rx="28" fill="url(#bg)"/>
<text x="62" y="72" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">The top 10% of drugs carry a disproportionate DDI burden</text>
<text x="62" y="108" fill="#b7d4df" font-family="Arial,Helvetica,sans-serif" font-size="17">Endpoint share after ranking drugs by overall interaction degree</text>
<line x1="70" y1="345" x2="1035" y2="345" stroke="#6f8b99" stroke-width="1" opacity=".55"/>
<line x1="70" y1="271" x2="1035" y2="271" stroke="#6f8b99" stroke-width="1" opacity=".25"/>
<line x1="70" y1="197" x2="1035" y2="197" stroke="#6f8b99" stroke-width="1" opacity=".25"/>
<line x1="70" y1="123" x2="1035" y2="123" stroke="#6f8b99" stroke-width="1" opacity=".25"/>
<text x="38" y="350" fill="#9bb9c7" font-family="Arial" font-size="13">0%</text>
<text x="29" y="276" fill="#9bb9c7" font-family="Arial" font-size="13">20%</text>
<text x="29" y="202" fill="#9bb9c7" font-family="Arial" font-size="13">40%</text>
<text x="29" y="128" fill="#9bb9c7" font-family="Arial" font-size="13">60%</text>
<rect x="175" y="188.5" width="195" height="156.5" rx="14" fill="#e88936" filter="url(#shadow)"/>
<rect x="452" y="178.1" width="195" height="166.9" rx="14" fill="#38a5b7" filter="url(#shadow)"/>
<rect x="729" y="228.1" width="195" height="116.9" rx="14" fill="#87c6c4" filter="url(#shadow)"/>
<text x="272.5" y="171" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="34" font-weight="700">42.3%</text>
<text x="549.5" y="161" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="34" font-weight="700">45.1%</text>
<text x="826.5" y="211" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="34" font-weight="700">31.6%</text>
<text x="272.5" y="379" text-anchor="middle" fill="#f6c99f" font-family="Arial" font-size="16" font-weight="700">Candidate</text>
<text x="549.5" y="379" text-anchor="middle" fill="#a9e0e8" font-family="Arial" font-size="16" font-weight="700">Construction reference</text>
<text x="826.5" y="379" text-anchor="middle" fill="#c6e8e5" font-family="Arial" font-size="16" font-weight="700">Independent DDInter</text>
<text x="1010" y="405" text-anchor="end" fill="#7395a5" font-family="Arial" font-size="12">DDI-BurdenMap · v1.0</text>
