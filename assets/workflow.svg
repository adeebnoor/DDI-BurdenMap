<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220"><style>.t{font-family:Arial,sans-serif;font-size:20px;fill:#111}.s{font-family:Arial,sans-serif;font-size:15px;fill:#444}.b{fill:#f5f7fa;stroke:#687386;stroke-width:2}.a{stroke:#687386;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#687386"/></marker></defs><rect class="b" x="20" y="55" rx="12" width="210" height="105"/><text class="t" x="125" y="88" text-anchor="middle">Candidate DDI pairs</text><text class="s" x="125" y="118" text-anchor="middle">16,316 pairs / 1,114 drugs</text><text class="s" x="125" y="143" text-anchor="middle">fixed analytical input</text><line class="a" x1="230" y1="108" x2="285" y2="108"/><rect class="b" x="290" y="55" rx="12" width="210" height="105"/><text class="t" x="395" y="88" text-anchor="middle">Network topology</text><text class="s" x="395" y="118" text-anchor="middle">degree, Gini, centrality</text><text class="s" x="395" y="143" text-anchor="middle">connectivity + robustness</text><line class="a" x1="500" y1="108" x2="555" y2="108"/><rect class="b" x="560" y="55" rx="12" width="185" height="105"/><text class="t" x="652" y="88" text-anchor="middle">Mechanisms</text><text class="s" x="652" y="118" text-anchor="middle">GoldD3R strata</text><text class="s" x="652" y="143" text-anchor="middle">10 mechanism classes</text><line class="a" x1="745" y1="108" x2="800" y2="108"/><rect class="b" x="805" y="55" rx="12" width="155" height="105"/><text class="t" x="882" y="88" text-anchor="middle">DDInter</text><text class="s" x="882" y="118" text-anchor="middle">independent</text><text class="s" x="882" y="143" text-anchor="middle">severity check</text></svg>