<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
<title id="title">Independent DDInter validation</title>
<desc id="desc">DDInter validation contains 160235 pairs among 1939 drugs. Top-decile endpoint share is 31.6 percent, Major endpoint capture is 33.5 percent, and Spearman correlation is 0.667.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081a2d"/><stop offset="1" stop-color="#12394d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity=".22"/></filter></defs>
<rect width="1100" height="455" rx="28" fill="url(#bg)"/>
<text x="58" y="65" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Independent DDInter replication</text>
<text x="58" y="101" fill="#b9d5df" font-family="Arial" font-size="17">Structural concentration replicates; severity remains a separate question</text>
<g filter="url(#s)">
<rect x="58" y="140" width="232" height="154" rx="18" fill="#102f43" stroke="#2d6075"/>
<rect x="310" y="140" width="232" height="154" rx="18" fill="#102f43" stroke="#2d6075"/>
<rect x="562" y="140" width="232" height="154" rx="18" fill="#102f43" stroke="#2d6075"/>
<rect x="814" y="140" width="228" height="154" rx="18" fill="#102f43" stroke="#2d6075"/>
</g>
<text x="174" y="195" text-anchor="middle" fill="#8eced4" font-family="Arial" font-size="15" font-weight="700">INTERACTION PAIRS</text><text x="174" y="247" text-anchor="middle" fill="#fff" font-family="Arial" font-size="34" font-weight="700">160,235</text>
<text x="426" y="195" text-anchor="middle" fill="#8eced4" font-family="Arial" font-size="15" font-weight="700">DRUGS</text><text x="426" y="247" text-anchor="middle" fill="#fff" font-family="Arial" font-size="34" font-weight="700">1,939</text>
<text x="678" y="188" text-anchor="middle" fill="#f1b276" font-family="Arial" font-size="14" font-weight="700">TOP-DECILE BURDEN</text><text x="678" y="239" text-anchor="middle" fill="#fff" font-family="Arial" font-size="34" font-weight="700">31.6%</text><text x="678" y="267" text-anchor="middle" fill="#9abac7" font-family="Arial" font-size="13">random-set mean: 10.0%</text>
<text x="928" y="188" text-anchor="middle" fill="#ef9c8d" font-family="Arial" font-size="14" font-weight="700">MAJOR CAPTURE</text><text x="928" y="239" text-anchor="middle" fill="#fff" font-family="Arial" font-size="34" font-weight="700">33.5%</text><text x="928" y="267" text-anchor="middle" fill="#9abac7" font-family="Arial" font-size="13">permutation null: 31.6%</text>
<rect x="58" y="325" width="984" height="78" rx="18" fill="#0c2638" stroke="#31586b"/>
<circle cx="95" cy="364" r="17" fill="#e88936"/><text x="95" y="370" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="700">ρ</text>
<text x="129" y="357" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Degree vs. number of Major interactions: ρ = 0.667</text>
<text x="129" y="382" fill="#a9c5d0" font-family="Arial" font-size="14">The part–whole permutation null is much higher (mean ρ = 0.984): topology tracks interaction volume more strongly than severity.</text>
<text x="1040" y="433" text-anchor="end" fill="#7395a5" font-family="Arial" font-size="12">DDI-BurdenMap · independent validation</text>
</svg>
